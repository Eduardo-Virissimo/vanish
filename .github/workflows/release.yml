# Publica uma versão nova do Vanish no GitHub Releases.
# Como usar (ver docs/RELEASE.md): suba a versão no package.json, faça commit, e então
#   git tag v0.5.0 && git push origin v0.5.0
# O GitHub roda os testes, gera o instalador e cria a release. Os apps instalados
# encontram a versão nova sozinhos (electron-updater lê o latest.yml da release).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # criar a release e subir o instalador

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # a tag e o package.json precisam dizer a mesma versão; senão o atualizador se confunde
      - name: Conferir versão da tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "A tag é v$tag, mas o package.json diz $pkg. Ajuste um dos dois."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (regras de segurança + motor em pastas falsas)
        run: npm test

      # A release é criada ANTES (como rascunho), e o electron-builder só envia os arquivos para ela.
      # Sem isso ele envia o .exe, o .blockmap e o latest.yml em paralelo e às vezes cria duas
      # releases com a mesma tag (aconteceu na v0.5.1: o link de download do README dava 404).
      - name: Criar a release (rascunho)
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Vanish ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar instalador e enviar para a release
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # só publica se os três arquivos estiverem lá; senão a release fica em rascunho para conferir
      - name: Conferir arquivos e publicar
        shell: bash
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$assets"
          for f in Vanish-Setup.exe Vanish-Setup.exe.blockmap latest.yml; do
            grep -qx "$f" <<<"$assets" || { echo "Falta $f na release"; exit 1; }
          done
          count="$(gh release list --json tagName --jq "[.[] | select(.tagName == \"$GITHUB_REF_NAME\")] | length")"
          [ "$count" = "1" ] || { echo "Há $count releases com a tag $GITHUB_REF_NAME"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
