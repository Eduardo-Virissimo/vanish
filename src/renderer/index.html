<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Vanish</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="titlebar">
      <button class="menu-btn" id="panel-toggle" type="button"
              aria-label="Abrir menu" title="Menu"
              aria-expanded="false" aria-controls="panel">
        <!-- três linhas que viram um X quando o menu abre (panel.css) -->
        <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>

    <main class="main" id="main">
      <header class="top">
        <h1 class="usage">
          <span class="used" id="used">&nbsp;</span>
          <span class="of" id="of"></span>
        </h1>
        <div class="top-actions">
          <button class="ghost-btn" id="rescan" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8m0-5v5h5M4 13a8 8 0 0 0 14.3 4.9L20 16m0 5v-5h-5"/></svg>
            Analisar de novo
          </button>
        </div>
        <p class="status" id="status" aria-live="polite">
          <span class="status-verb" id="status-verb"></span>
          <span class="status-path" id="status-path"></span>
        </p>
      </header>

      <div class="bar-wrap">
        <canvas id="bar" aria-hidden="true"></canvas>
      </div>

      <ul class="cats" id="cats" aria-label="Categorias para limpar"></ul>
    </main>

    <footer class="foot">
      <p class="foot-msg">
        <svg class="foot-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5 2.5 7.6 12 12.7l9.5-5.1z" fill="#FFB547"/>
          <path d="m2.5 12 9.5 5.1 9.5-5.1" fill="none" stroke="#FFB547" stroke-width="2" stroke-linejoin="round" opacity=".75"/>
          <path d="m2.5 16.4 9.5 5.1 9.5-5.1" fill="none" stroke="#FFB547" stroke-width="2" stroke-linejoin="round" opacity=".45"/>
        </svg>
        <span id="msg"></span>
      </p>
      <div class="actions">
        <button class="btn" id="clean" type="button" disabled>Limpar selecionados</button>
      </div>
    </footer>

    <!-- Menu (☰): desliza da esquerda por cima do conteúdo. Logo + nome no topo, pastas embaixo -->
    <div class="scrim" id="scrim"></div>
    <aside class="panel" id="panel" tabindex="-1" aria-label="Menu" inert>
      <div class="panel-inner" id="panel-scroll">
        <!-- na mesma linha do ☰, que vem deslizando e vira o X de fechar no canto direito -->
        <header class="panel-brand">
          <img class="panel-mark" src="mark.svg" alt="" width="30" height="30">
          <p class="panel-app-name">Vanish</p>
        </header>

        <section class="panel-section" aria-labelledby="panel-title">
          <h2 class="panel-title" id="panel-title">Pastas que serão limpas</h2>
          <p class="panel-count" id="panel-count"></p>
          <p class="panel-intro">Só o conteúdo dessas pastas é apagado; as pastas continuam existindo. Clique numa pasta para abrir no Explorador e conferir.</p>
          <div class="panel-list" id="panel-list"></div>
        </section>
      </div>
    </aside>

    <!-- Confirmação antes de apagar: lista o que vai acontecer com cada categoria -->
    <div class="modal-scrim" id="confirm-scrim" hidden>
      <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
        <h2 class="modal-title" id="confirm-title"></h2>
        <p class="modal-desc" id="confirm-desc">Confira o que vai acontecer. Isso não pode ser desfeito.</p>
        <ul class="confirm-list" id="confirm-list"></ul>
        <label class="confirm-ack" id="confirm-ack-row" hidden>
          <input type="checkbox" id="confirm-ack">
          <span>Entendi que os itens em vermelho são apagados de vez</span>
        </label>
        <div class="modal-actions">
          <button class="btn" id="confirm-cancel" type="button">Cancelar</button>
          <button class="btn danger" id="confirm-ok" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tela de abertura: a marca e o nome no meio, tudo preto em volta -->
  <div class="splash" id="splash" role="status" aria-label="Abrindo Vanish">
    <div class="splash-glow"></div>
    <img class="splash-mark" src="mark.svg" alt="" width="150" height="150">
    <p class="splash-name">Vanish</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
